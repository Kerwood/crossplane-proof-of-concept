apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xdeployments.example.org
spec:
  group: example.org
  names:
    kind: XDeployment
    plural: xdeployments
  scope: Namespaced
  versions:
  - name: v1
    referenceable: true
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              env:
                additionalProperties:
                  type: string
                type: object
              hostname:
                pattern: ^[a-z0-9][a-z0-9\-\.]+[a-z0-9]$
                type: string
              image:
                minLength: 1
                type: string
              port:
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                default: 1
                format: int32
                maximum: 50
                minimum: 1
                type: integer
              serviceAccountName:
                type: string
              singleSignOn:
                properties:
                  connectionDetailsSecretRef:
                    properties:
                      name:
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  enableAuthProxy:
                    default: false
                    type: boolean
                type: object
              tag:
                minLength: 1
                type: string
            required:
            - image
            - tag
            type: object
          status:
            type: object
        type: object
    served: true
